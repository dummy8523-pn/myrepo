        .controls { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
        .btn { background: #333; color: #fff; border: 1px solid #555; padding: 10px; cursor: pointer; border-radius: 4px; flex: 1; min-width: 80px; text-align: center; font-family: 'Lato', sans-serif; }
        .btn.active { background: #00e5ff; color: #000; font-weight: bold; }
        .btn-share { background: #25D366; color: #000; font-weight: bold; }
        #search { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; background: #222; color: #fff; border: 1px solid #555; border-radius: 4px; font-family: 'Lato', sans-serif; }
        select.btn { appearance: none; -webkit-appearance: none; }
        
        table { width: 100%; border-collapse: collapse; background: #fff; color: #000; table-layout: auto; }
        th, td { padding: 8px 5px; border: 1px solid #ccc; text-align: left; font-size: 13px; }
        th { background: #222; color: #fff; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 2px -1px rgba(0, 0, 0, 0.4); }

        .conflict { background-color: #ffdddd !important; border-left: 4px solid #ff0000; }
        .fav-btn { cursor: pointer; color: #ccc; border: none; background: none; font-size: 22px; padding: 0; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
        .fav-btn.active { color: #ffcc00; text-shadow: 0 0 5px rgba(255,204,0,0.5); }

        const data = rawData.map(d => ({
            day: d[0], stage: d[1], startStr: d[2], endStr: d[3], artist: d[4]
        }));
        
        const headliners = ["Armin van Buuren", "Charlotte de Witte", "Timmy Trumpet", "The Chainsmokers", "Hardwell", "Steve Aoki", "Fisher", "Scooter", "Brennan Heart", "Da Tweekaz"];
        let favs = JSON.parse(localStorage.getItem('favs2026') || '[]');
        let currentFilter = 'all';

        const params = new URLSearchParams(window.location.search);
        if (params.has('crew')) {
            try {
                const sharedFavs = JSON.parse(atob(params.get('crew')));
                if(confirm("Bäm! Du hast einen Plan von der Crew bekommen. Soll er deine aktuellen Favoriten ersetzen?")) {
                    favs = sharedFavs;
                    localStorage.setItem('favs2026', JSON.stringify(favs));
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            } catch(e) { alert("Ungültiger Plan-Link!"); }
        }

        const stages = [...new Set(data.map(item => item.stage))];
        const stageSelect = document.getElementById('stageFilter');
        stages.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s; opt.innerText = s;
            stageSelect.appendChild(opt);
        });

        function getSortTime(timeStr) {
            let [h, m] = timeStr.split(':').map(Number);
            return h < 5 ? (h + 24) * 60 + m : h * 60 + m;
        }

        function isPast(day, time) {
            const now = new Date();
            const dayMap = {"Freitag": 17, "Samstag": 18, "Sonntag": 19};
            const [h, m] = time.split(':').map(Number);
            const targetDate = new Date(2026, 6, dayMap[day], h, m);
            if (h < 5) targetDate.setDate(targetDate.getDate() + 1);
            return now > targetDate;
        }

        function checkConflict(i, favsList) {
            const current = data[i];
            const currentStart = getSortTime(current.startStr);
            const currentEnd = getSortTime(current.endStr);

            return favsList.some(fIdx => {
                if (i === fIdx) return false;
                const other = data[fIdx];
                if (current.day !== other.day) return false;
                
                const otherStart = getSortTime(other.startStr);
                const otherEnd = getSortTime(other.endStr);
                
                const buffer = (current.stage !== other.stage) ? 15 : 0;
                
                return (currentStart < (otherEnd + buffer) && (otherStart - buffer) < currentEnd);
            });
        }

        function render() {
            const tbody = document.getElementById('tbody');
            const query = document.getElementById('search').value.toLowerCase();
            const dayF = document.getElementById('dayFilter').value;
            const stageF = document.getElementById('stageFilter').value;
            tbody.innerHTML = '';
            
            data.forEach((row, i) => {
                if (currentFilter === 'headliner' && !headliners.includes(row.artist)) return;
                if (currentFilter === 'favs' && !favs.includes(i)) return;
                if (dayF !== 'all' && row.day !== dayF) return;
                if (stageF !== 'all' && row.stage !== stageF) return;
                if (query && !row.artist.toLowerCase().includes(query)) return;

                const past = isPast(row.day, row.startStr) ? 'past' : '';
                const conflict = (currentFilter === 'favs' && checkConflict(i, favs)) ? 'conflict' : '';
                
                tbody.innerHTML += `<tr class="${past} ${conflict}">
                    <td>${row.day.substring(0,2)}</td>
                    <td>${row.stage}</td>
                    <td>${row.startStr} - ${row.endStr}</td>
                    <td><b>${row.artist}</b></td>
                    <td><button class="fav-btn ${favs.includes(i) ? 'active' : ''}" onclick="toggleFav(${i})">★</button></td>
                </tr>`;
            });
        }

        function toggleFav(i) {
            if (favs.includes(i)) favs = favs.filter(id => id !== i);
            else favs.push(i);
            localStorage.setItem('favs2026', JSON.stringify(favs));
            render();
        }

        function setFilter(type, btn) {
           currentFilter = type;
    
           // Entfernt die Markierung von allen drei Schnellfilter-Buttons
           document.getElementById('btn-all').classList.remove('active');
           document.getElementById('btn-headliner').classList.remove('active');
           document.getElementById('btn-favs').classList.remove('active');
    
           // Setzt die Markierung auf den aktuell geklickten Button
           if(btn) btn.classList.add('active');
    
           render();
        }


        function shareFavs() {
            if (favs.length === 0) {
                alert("Wähl erst ein paar Acts aus, bevor du den Plan teilst!");
                return;
            }
            const encoded = btoa(JSON.stringify(favs));
            const url = new URL(window.location.href);
            url.searchParams.set('crew', encoded);
            
            navigator.clipboard.writeText(url.toString()).then(() => {
                alert("Link kopiert! Du kannst ihn jetzt direkt in WhatsApp einfügen und teilen.");
            }).catch(() => {
                alert("Link kopieren fehlgeschlagen. Hier ist der Link:\n\n" + url.toString());
            });
        }

        document.getElementById('search').addEventListener('input', render);
        
        const dayOrder = {"Freitag": 1, "Samstag": 2, "Sonntag": 3};
        data.sort((a, b) => dayOrder[a.day] - dayOrder[b.day] || getSortTime(a.startStr) - getSortTime(b.startStr));
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('Offline-Modus aktiv!', reg);
                });
            });
        }

        render();
    </script>
